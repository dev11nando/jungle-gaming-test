services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
      - ./docker/keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/keycloak/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_REGION: us-east-1
      SQS_QUEUE_NAME: wager-transactions.fifo
      KEYCLOAK_ISSUER: http://localhost:8080/realms/jungle
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: wagering-api
      KEYCLOAK_HEALTH_URL: http://keycloak:8080/realms/jungle/.well-known/openid-configuration
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres-data:
